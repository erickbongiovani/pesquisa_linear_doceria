<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOP - Sistema de Otimização</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">SOP Industrial</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/insumos">Insumos</a>
                <a class="nav-link" href="/produtos">Produtos</a>
                <a class="nav-link" href="/receitas">Receitas</a>
                <a class="nav-link btn btn-primary text-white ms-lg-3" href="/otimizar">OTIMIZAR MIX</a>
            </div>
        </div>
    </nav>

    <div class="container">
        {% if get_flashed_messages() %}
            <div class="alert alert-info alert-dismissible fade show" role="alert">
                {{ get_flashed_messages() | join(" ") }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endif %}

        {% block main %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
